name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - run: python -m pytest -q
      - name: Clean demo must pass
        run: python -m lab.cli demo out/ && python -m lab.cli reconcile out/manifest.json out/landed out/staging/staging-report.json
      - name: Faulted demo must be detected
        run: |
          python -m lab.cli demo out-faults/ --faults
          if python -m lab.cli reconcile out-faults/manifest.json out-faults/landed out-faults/staging/staging-report.json; then
            echo "faults were not detected"; exit 1
          fi
